<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NexusNode - System Authentication</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#690005",
                        "surface-tint": "#00daf3",
                        "error": "#ffb4ab",
                        "on-secondary-fixed": "#2a0053",
                        "surface-variant": "#2e3638",
                        "error-container": "#93000a",
                        "surface-container-high": "#242b2d",
                        "on-secondary": "#460283",
                        "on-surface": "#dce4e5",
                        "on-tertiary-container": "#6f5500",
                        "on-secondary-fixed-variant": "#5e289b",
                        "tertiary-fixed-dim": "#f3bf26",
                        "on-tertiary": "#3e2e00",
                        "on-background": "#dce4e5",
                        "surface-bright": "#333a3c",
                        "on-tertiary-fixed": "#251a00",
                        "on-error-container": "#ffdad6",
                        "inverse-on-surface": "#2a3233",
                        "primary-fixed-dim": "#00daf3",
                        "tertiary-fixed": "#ffdf96",
                        "outline-variant": "#3b494c",
                        "on-surface-variant": "#bac9cc",
                        "surface-container-lowest": "#080f11",
                        "outline": "#849396",
                        "inverse-primary": "#006875",
                        "on-tertiary-fixed-variant": "#594400",
                        "surface": "#0d1516",
                        "on-primary-fixed-variant": "#004f58",
                        "primary-fixed": "#9cf0ff",
                        "on-secondary-container": "#cfa7ff",
                        "on-primary-container": "#00626e",
                        "on-primary-fixed": "#001f24",
                        "primary": "#c3f5ff",
                        "surface-container": "#192122",
                        "tertiary": "#ffeac0",
                        "surface-dim": "#0d1516",
                        "background": "#0d1516",
                        "surface-container-low": "#151d1e",
                        "surface-container-highest": "#2e3638",
                        "primary-container": "#00e5ff",
                        "secondary": "#dab9ff",
                        "inverse-surface": "#dce4e5",
                        "tertiary-container": "#fec931",
                        "on-primary": "#00363d",
                        "secondary-fixed": "#eedbff",
                        "secondary-container": "#602b9d",
                        "secondary-fixed-dim": "#dab9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-gap": "8px",
                        "container-padding": "16px",
                        "element-gap": "4px",
                        "section-margin": "24px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline-md": ["Inter"],
                        "data-md": ["JetBrains Mono"],
                        "data-lg": ["JetBrains Mono"],
                        "headline-lg": ["Inter"],
                        "data-sm": ["JetBrains Mono"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "label-caps": ["10px", { "lineHeight": "12px", "letterSpacing": "0.06em", "fontWeight": "700" }],
                        "headline-md": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "data-md": ["13px", { "lineHeight": "18px", "fontWeight": "500" }],
                        "data-lg": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "data-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .grid-bg {
            background-image: 
                linear-gradient(to right, rgba(59, 73, 76, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(59, 73, 76, 0.1) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to bottom, transparent, rgba(195, 245, 255, 0.2), transparent);
            opacity: 0.5;
            animation: scan 4s linear infinite;
            pointer-events: none;
        }
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #192122 inset !important;
            -webkit-text-fill-color: #dce4e5 !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen overflow-hidden selection:bg-primary/30 selection:text-primary">
<!-- Background Texture -->
<div class="fixed inset-0 grid-bg z-0"></div>
<div class="scanline z-0"></div>
<main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-container-padding py-section-margin">
<!-- Authentication Container -->
<div class="w-full max-w-[400px] bg-surface border border-outline-variant p-8 relative">
<!-- Decorative Corners -->
<div class="absolute top-0 left-0 w-2 h-2 border-t border-l border-primary"></div>
<div class="absolute top-0 right-0 w-2 h-2 border-t border-r border-primary"></div>
<div class="absolute bottom-0 left-0 w-2 h-2 border-b border-l border-primary"></div>
<div class="absolute bottom-0 right-0 w-2 h-2 border-b border-r border-primary"></div>
<!-- Header -->
<div class="mb-10 text-center flex flex-col items-center">
<span class="material-symbols-outlined text-primary text-[48px] mb-4" style="font-variation-settings: 'FILL' 0;">hub</span>
<h1 class="font-headline-lg text-headline-lg font-bold text-primary tracking-tighter">NexusNode</h1>
</div>
<!-- Login Form -->
<form class="space-y-6">
<!-- Username Input -->
<div class="space-y-unit">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase flex justify-between">
<span>Identifier</span>
<span class="text-outline">SYS.AUTH.01</span>
</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors text-[18px]">badge</span>
<input autocomplete="username" class="w-full bg-surface-container border border-outline-variant text-on-surface font-data-md text-data-md pl-10 pr-3 py-3 focus:border-primary focus:ring-0 outline-none transition-colors" placeholder="Admin_Root" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-unit">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase flex justify-between">
<span>Access Key</span>
<span class="text-outline">SYS.AUTH.02</span>
</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors text-[18px]">password</span>
<input autocomplete="current-password" class="w-full bg-surface-container border border-outline-variant text-on-surface font-data-md text-data-md pl-10 pr-10 py-3 focus:border-primary focus:ring-0 outline-none transition-colors tracking-widest" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">visibility_off</span>
</button>
</div>
</div>
<!-- Action Button -->
<div class="pt-6">
<button class="w-full bg-surface border border-primary text-primary font-headline-md text-headline-md py-3 flex items-center justify-center gap-2 hover:bg-primary/10 transition-colors active:scale-[0.98] group relative overflow-hidden" type="button">
<div class="absolute inset-0 bg-primary/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
<span class="material-symbols-outlined relative z-10 group-hover:rotate-90 transition-transform duration-300">key</span>
<span class="relative z-10 uppercase tracking-wide text-sm">Unlock System</span>
</button>
</div>
</form>
<!-- Footer Status -->
<div class="mt-8 pt-4 border-t border-outline-variant flex items-center justify-between">
<span class="font-data-sm text-data-sm text-on-surface-variant uppercase tracking-wider">NET: LAN // AWAITING AUTH</span>
<span class="font-data-sm text-data-sm text-outline-variant">v4.2.0</span>
</div>
</div>
<!-- Terminal Output Decorative Element -->
<div class="mt-8 w-full max-w-[400px] font-data-sm text-data-sm text-outline-variant opacity-50 select-none">
<p>&gt; initializing secure handshake...</p>
<p>&gt; connecting to core node via port 443...</p>
<p>&gt; awaiting user authentication...</p>
<p class="animate-pulse">_</p>
</div>
</main>
</body></html>
