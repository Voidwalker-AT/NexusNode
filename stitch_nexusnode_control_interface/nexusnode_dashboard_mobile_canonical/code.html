<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NexusNode Mobile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#690005",
                        "surface-tint": "#00daf3",
                        "error": "#ffb4ab",
                        "on-secondary-fixed": "#2a0053",
                        "surface-variant": "#2e3638",
                        "error-container": "#93000a",
                        "surface-container-high": "#242b2d",
                        "on-secondary": "#460283",
                        "on-surface": "#dce4e5",
                        "on-tertiary-container": "#6f5500",
                        "on-secondary-fixed-variant": "#5e289b",
                        "tertiary-fixed-dim": "#f3bf26",
                        "on-tertiary": "#3e2e00",
                        "on-background": "#dce4e5",
                        "surface-bright": "#333a3c",
                        "on-tertiary-fixed": "#251a00",
                        "on-error-container": "#ffdad6",
                        "inverse-on-surface": "#2a3233",
                        "primary-fixed-dim": "#00daf3",
                        "tertiary-fixed": "#ffdf96",
                        "outline-variant": "#3b494c",
                        "on-surface-variant": "#bac9cc",
                        "surface-container-lowest": "#080f11",
                        "outline": "#849396",
                        "inverse-primary": "#006875",
                        "on-tertiary-fixed-variant": "#594400",
                        "surface": "#0d1516",
                        "on-primary-fixed-variant": "#004f58",
                        "primary-fixed": "#9cf0ff",
                        "on-secondary-container": "#cfa7ff",
                        "on-primary-container": "#00626e",
                        "on-primary-fixed": "#001f24",
                        "primary": "#c3f5ff",
                        "surface-container": "#192122",
                        "tertiary": "#ffeac0",
                        "surface-dim": "#0d1516",
                        "background": "#0d1516",
                        "surface-container-low": "#151d1e",
                        "surface-container-highest": "#2e3638",
                        "primary-container": "#00e5ff",
                        "secondary": "#dab9ff",
                        "inverse-surface": "#dce4e5",
                        "tertiary-container": "#fec931",
                        "on-primary": "#00363d",
                        "secondary-fixed": "#eedbff",
                        "secondary-container": "#602b9d",
                        "secondary-fixed-dim": "#dab9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-gap": "8px",
                        "container-padding": "16px",
                        "element-gap": "4px",
                        "section-margin": "24px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline-md": ["Inter"],
                        "data-md": ["JetBrains Mono"],
                        "data-lg": ["JetBrains Mono"],
                        "headline-lg": ["Inter"],
                        "data-sm": ["JetBrains Mono"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "label-caps": ["10px", { "lineHeight": "12px", "letterSpacing": "0.06em", "fontWeight": "700" }],
                        "headline-md": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "data-md": ["13px", { "lineHeight": "18px", "fontWeight": "500" }],
                        "data-lg": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "data-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
        /* Micro-animations for technical feel */
        .scanline {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,229,255,0.02) 50%, rgba(0,229,255,0.02));
            background-size: 100% 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface-container-lowest text-on-surface font-body-md text-body-md pb-20 antialiased scanline min-h-screen">
<!-- Top Status Strip -->
<header class="sticky top-0 z-40 bg-surface-container border-b border-outline-variant px-container-padding py-2 flex justify-between items-center backdrop-blur-sm bg-opacity-90 min-h-[44px]">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[14px]">memory</span>
<span class="font-data-sm text-data-sm text-on-surface-variant uppercase">TECNO BG6</span>
</div>
<div class="flex items-center gap-element-gap">
<div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></div>
<span class="font-data-sm text-data-sm text-primary uppercase">ONLINE</span>
</div>
<div class="font-data-sm text-data-sm text-on-surface-variant">UP: 14D 02H</div>
</header>
<main class="flex flex-col gap-stack-gap p-container-padding">
<!-- Health Section (Compact Meters) -->
<section class="bg-surface-container-low border border-outline-variant rounded-DEFAULT p-3 flex flex-col gap-element-gap">
<div class="flex justify-between items-center mb-1">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase">System Resources</h2>
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">monitor_heart</span>
</div>
<!-- RAM -->
<div class="flex items-center gap-2">
<span class="font-data-sm text-data-sm text-on-surface-variant w-8">RAM</span>
<div class="flex-1 h-2 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary" style="width: 70%"></div>
</div>
<span class="font-data-md text-data-md text-primary w-12 text-right">2.8/4G</span>
</div>
<!-- Swap -->
<div class="flex items-center gap-2">
<span class="font-data-sm text-data-sm text-on-surface-variant w-8">SWP</span>
<div class="flex-1 h-2 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary" style="width: 25%"></div>
</div>
<span class="font-data-md text-data-md text-on-surface w-12 text-right">0.5/2G</span>
</div>
<!-- Battery -->
<div class="flex items-center gap-2">
<span class="font-data-sm text-data-sm text-on-surface-variant w-8">BAT</span>
<div class="flex-1 h-2 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary" style="width: 98%"></div>
</div>
<span class="font-data-md text-data-md text-primary w-12 text-right">98%</span>
</div>
</section>
<!-- Services Section -->
<section class="bg-surface-container-low border border-outline-variant rounded-DEFAULT p-3 flex justify-between items-center">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">NexusNode Services</span>
<span class="font-data-sm text-data-sm text-on-surface mt-1">3 Active Components</span>
</div>
<div class="flex gap-2">
<div class="w-3 h-3 rounded-full bg-primary border border-surface-container-lowest" title="Network"></div>
<div class="w-3 h-3 rounded-full bg-primary border border-surface-container-lowest" title="Database"></div>
<div class="w-3 h-3 rounded-full bg-primary border border-surface-container-lowest" title="API"></div>
</div>
</section>
<!-- Active Task -->
<section class="bg-surface-container-low border border-primary/30 rounded-DEFAULT p-3 relative overflow-hidden">
<!-- Subtle background highlight for active task -->
<div class="absolute inset-0 bg-primary/5 pointer-events-none"></div>
<div class="flex justify-between items-start mb-2 relative z-10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[18px] animate-spin-slow">sync</span>
<h3 class="font-data-md text-data-md text-primary">Worker Task: RAG Rebuild</h3>
</div>
<span class="font-data-sm text-data-sm text-on-surface-variant">Running</span>
</div>
<div class="w-full h-1.5 bg-surface-variant rounded-full overflow-hidden relative z-10">
<div class="h-full bg-primary transition-all duration-1000 ease-in-out w-3/4"></div>
</div>
<div class="flex justify-between items-center mt-1 relative z-10">
<span class="font-data-sm text-data-sm text-on-surface-variant">Chunk 14,204 / 18,500</span>
<span class="font-data-sm text-data-sm text-primary">76%</span>
</div>
</section>
<!-- Quick Actions (2x3 Grid) -->
<section>
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-2 ml-1">Quick Directives</h2>
<div class="grid grid-cols-3 gap-element-gap">
<!-- Action 1 -->
<button class="bg-surface-container border border-outline-variant hover:border-primary active:bg-surface-variant rounded-DEFAULT p-3 min-h-[44px] flex flex-col items-center justify-center gap-1 transition-colors">
<span class="material-symbols-outlined text-on-surface text-[20px]">terminal</span>
<span class="font-label-caps text-label-caps text-on-surface">Console</span>
</button>
<!-- Action 2 -->
<button class="bg-surface-container border border-outline-variant hover:border-primary active:bg-surface-variant rounded-DEFAULT p-3 min-h-[44px] flex flex-col items-center justify-center gap-1 transition-colors">
<span class="material-symbols-outlined text-on-surface text-[20px]">restart_alt</span>
<span class="font-label-caps text-label-caps text-on-surface">Restart</span>
</button>
<!-- Action 3 -->
<button class="bg-surface-container border border-outline-variant hover:border-primary active:bg-surface-variant rounded-DEFAULT p-3 min-h-[44px] flex flex-col items-center justify-center gap-1 transition-colors">
<span class="material-symbols-outlined text-on-surface text-[20px]">sync</span>
<span class="font-label-caps text-label-caps text-on-surface">Sync</span>
</button>
<!-- Action 4 -->
<button class="bg-surface-container border border-outline-variant hover:border-primary active:bg-surface-variant rounded-DEFAULT p-3 min-h-[44px] flex flex-col items-center justify-center gap-1 transition-colors">
<span class="material-symbols-outlined text-on-surface text-[20px]">backup</span>
<span class="font-label-caps text-label-caps text-on-surface">Backup</span>
</button>
<!-- Action 5 -->
<button class="bg-surface-container border border-outline-variant hover:border-primary active:bg-surface-variant rounded-DEFAULT p-3 min-h-[44px] flex flex-col items-center justify-center gap-1 transition-colors">
<span class="material-symbols-outlined text-on-surface text-[20px]">list_alt</span>
<span class="font-label-caps text-label-caps text-on-surface">Logs</span>
</button>
<!-- Action 6 -->
<button class="bg-surface-container border border-outline-variant hover:border-primary active:bg-surface-variant rounded-DEFAULT p-3 min-h-[44px] flex flex-col items-center justify-center gap-1 transition-colors">
<span class="material-symbols-outlined text-on-surface text-[20px]">settings</span>
<span class="font-label-caps text-label-caps text-on-surface">Settings</span>
</button>
</div>
</section>
</main>
<!-- BottomNavBar Component -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex md:hidden justify-around items-center h-16 px-2 bg-surface border-t border-outline-variant">
<!-- Active Tab: Dashboard -->
<button class="flex flex-col items-center justify-center text-primary active:bg-surface-variant transition-transform duration-200 active:scale-90 p-2 min-h-[44px] rounded-lg w-16">
<span class="material-symbols-outlined mb-1">dashboard</span>
<span class="font-label-caps text-label-caps">Dash</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant active:bg-surface-variant transition-transform duration-200 active:scale-90 p-2 min-h-[44px] rounded-lg w-16 hover:text-primary">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">storage</span>
<span class="font-label-caps text-label-caps">Vault</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant active:bg-surface-variant transition-transform duration-200 active:scale-90 p-2 min-h-[44px] rounded-lg w-16 hover:text-primary">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">perm_media</span>
<span class="font-label-caps text-label-caps">Media</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant active:bg-surface-variant transition-transform duration-200 active:scale-90 p-2 min-h-[44px] rounded-lg w-16 hover:text-primary">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">checklist</span>
<span class="font-label-caps text-label-caps">Tasks</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant active:bg-surface-variant transition-transform duration-200 active:scale-90 p-2 min-h-[44px] rounded-lg w-16 hover:text-primary">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">psychology</span>
<span class="font-label-caps text-label-caps">AI</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant active:bg-surface-variant transition-transform duration-200 active:scale-90 p-2 min-h-[44px] rounded-lg w-16 hover:text-primary">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">menu</span>
<span class="font-label-caps text-label-caps">More</span>
</button>
</nav>
<style>
        .animate-spin-slow {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</body></html>
