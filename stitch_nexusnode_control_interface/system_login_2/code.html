<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NexusNode System Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#e5e2e1",
                        "on-primary-fixed-variant": "#004f58",
                        "surface-container-high": "#2a2a2a",
                        "on-surface-variant": "#bac9cc",
                        "primary-fixed-dim": "#00daf3",
                        "graphite-surface": "#121212",
                        "on-tertiary-fixed": "#1b1b1c",
                        "background": "#131313",
                        "inverse-on-surface": "#313030",
                        "surface-dim": "#131313",
                        "secondary-fixed": "#f4d9ff",
                        "on-tertiary": "#303030",
                        "border-subtle": "#333333",
                        "surface-container-lowest": "#0e0e0e",
                        "secondary-container": "#ab08ff",
                        "on-secondary-container": "#fef0ff",
                        "primary-container": "#00e5ff",
                        "graphite-raised": "#1E1E1E",
                        "tertiary": "#efeceb",
                        "oled-black": "#000000",
                        "on-secondary-fixed-variant": "#6f00a9",
                        "on-tertiary-container": "#5a5959",
                        "surface-container": "#201f1f",
                        "on-error": "#690005",
                        "on-secondary": "#4e0078",
                        "tertiary-container": "#d2d0cf",
                        "on-tertiary-fixed-variant": "#474746",
                        "surface-bright": "#393939",
                        "primary": "#c3f5ff",
                        "primary-fixed": "#9cf0ff",
                        "surface-container-low": "#1c1b1b",
                        "status-healthy": "#00C853",
                        "surface": "#131313",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "error-container": "#93000a",
                        "on-primary-container": "#00626e",
                        "on-primary": "#00363d",
                        "on-secondary-fixed": "#2f004b",
                        "surface-tint": "#00daf3",
                        "status-critical": "#D50000",
                        "outline-variant": "#3b494c",
                        "surface-variant": "#353534",
                        "secondary-fixed-dim": "#e4b5ff",
                        "inverse-primary": "#006875",
                        "inverse-surface": "#e5e2e1",
                        "tertiary-fixed": "#e5e2e1",
                        "surface-container-highest": "#353534",
                        "error": "#ffb4ab",
                        "on-error-container": "#ffdad6",
                        "secondary": "#e4b5ff",
                        "on-primary-fixed": "#001f24",
                        "on-background": "#e5e2e1",
                        "status-warning": "#FFD600",
                        "outline": "#849396"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "touch-target": "44px",
                        "margin-desktop": "24px",
                        "gutter": "16px",
                        "unit": "4px",
                        "stack-gap": "8px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "data-md": ["JetBrains Mono"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "data-lg": ["JetBrains Mono"],
                        "data-sm": ["JetBrains Mono"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["10px", { "lineHeight": "12px", "letterSpacing": "0.06em", "fontWeight": "700" }],
                        "data-md": ["13px", { "lineHeight": "18px", "fontWeight": "500" }],
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "data-lg": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "data-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "headline-md": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #000000;
            color: #e5e2e1;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .input-glow:focus-within {
            border-color: #00daf3;
            box-shadow: 0 0 0 1px #00daf3 inset;
        }

        .crt-flicker {
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            50% { opacity: 1; }
            100% { opacity: 0.95; }
        }

        /* Prevent autofill styles from breaking dark mode */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #1E1E1E inset !important;
            -webkit-text-fill-color: #e5e2e1 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile relative overflow-hidden crt-flicker">
<!-- Background Grid Effect -->
<div class="absolute inset-0 z-0 opacity-10" style="background-image: linear-gradient(#333333 1px, transparent 1px), linear-gradient(90deg, #333333 1px, transparent 1px); background-size: 24px 24px;"></div>
<main class="w-full max-w-[358px] z-10 flex flex-col gap-8">
<!-- Header Section -->
<header class="flex flex-col items-center gap-2 mb-4 text-center">
<div class="w-16 h-16 rounded border border-border-subtle bg-graphite-raised flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-3xl text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">dns</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">NexusNode</h1>
<p class="font-data-sm text-data-sm text-on-surface-variant flex items-center gap-1">
<span class="w-2 h-2 rounded-full bg-status-warning inline-block animate-pulse"></span>
                SYSTEM LOCKED_
            </p>
</header>
<!-- Form Container -->
<div class="bg-graphite-surface border border-border-subtle p-6 flex flex-col gap-6">
<div class="flex flex-col gap-4">
<!-- Identifier Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="identifier">IDENTIFIER</label>
<div class="relative flex items-center input-glow border border-border-subtle bg-graphite-raised transition-colors">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-lg">terminal</span>
<input class="w-full bg-transparent border-none text-on-surface font-data-md text-data-md pl-10 pr-3 py-3 focus:ring-0 placeholder-on-surface-variant/50" id="identifier" placeholder="Enter ID" type="text" value="Admin_Root"/>
</div>
</div>
<!-- Access Key Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="access-key">ACCESS KEY</label>
<div class="relative flex items-center input-glow border border-border-subtle bg-graphite-raised transition-colors">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-lg">key</span>
<input class="w-full bg-transparent border-none text-on-surface font-data-md text-data-md pl-10 pr-10 py-3 focus:ring-0 placeholder-on-surface-variant/50" id="access-key" placeholder="••••••••••••" type="password"/>
<button class="absolute right-3 text-on-surface-variant hover:text-primary-fixed-dim transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-lg" id="visibility-icon">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-touch-target bg-transparent border border-primary-fixed-dim text-primary-fixed-dim font-data-lg text-data-lg uppercase tracking-wider hover:bg-primary-fixed-dim/10 active:bg-primary-fixed-dim/20 transition-colors flex items-center justify-center gap-2 mt-2" type="button">
<span class="material-symbols-outlined text-lg">lock_open</span>
                UNLOCK SYSTEM
            </button>
</div>
<!-- Diagnostic Footer -->
<footer class="flex justify-between items-center border-t border-border-subtle pt-4 mt-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-status-warning text-sm">lan</span>
<span class="font-data-sm text-data-sm text-on-surface-variant">Awaiting Auth</span>
</div>
<span class="font-data-sm text-data-sm text-border-subtle">v4.2.0</span>
</footer>
</main>
<script>
        function togglePassword() {
            const input = document.getElementById('access-key');
            const icon = document.getElementById('visibility-icon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }
    </script>
</body></html>
