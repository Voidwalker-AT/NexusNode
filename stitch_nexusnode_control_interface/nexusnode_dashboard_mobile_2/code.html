<!DOCTYPE html><html class="dark" lang="en"><head>

<title>NexusNode System Controller</title>

<style>
        body { background-color: #000000; color: #e5e2e1; }
        .meter-fill { transition: width 0.3s ease; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body class="w-[390px] h-[844px] mx-auto overflow-hidden relative flex flex-col font-body-md text-body-md">
<!-- Status Strip -->
<header class="w-full flex items-center justify-between px-margin-mobile py-2 bg-graphite-surface border-b border-border-subtle z-10 shrink-0">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">sensors</span>
<span class="font-headline-md text-headline-md text-on-surface">NexusNode</span>
</div>
<div class="flex items-center gap-3">
<div class="flex items-center gap-1">
<div class="w-2 h-2 rounded-full bg-status-healthy blink"></div>
<span class="font-label-caps text-label-caps text-status-healthy">ONLINE</span>
</div>
</div>
</header>
<div class="px-margin-mobile py-1 bg-graphite-raised border-b border-border-subtle flex justify-between items-center shrink-0">
<span class="font-data-sm text-data-sm text-on-surface-variant">TECNO BG6</span>
<span class="font-data-sm text-data-sm text-on-surface-variant">Android 13</span>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-margin-mobile py-gutter flex flex-col gap-gutter pb-[60px]">
<!-- System Resources -->
<section class="flex flex-col gap-stack-gap">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">System Resources</h2>
<div class="bg-graphite-surface border border-border-subtle rounded flex flex-col p-3 gap-3">
<!-- RAM -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<span class="font-data-sm text-data-sm text-on-surface">RAM</span>
<span class="font-data-sm text-data-sm text-primary-fixed-dim">2.4 / 4.0 GB</span>
</div>
<div class="h-1 bg-border-subtle w-full rounded-full overflow-hidden">
<div class="h-full bg-primary-fixed-dim meter-fill" style="width: 60%;"></div>
</div>
</div>
<!-- Storage -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<span class="font-data-sm text-data-sm text-on-surface">Vault Storage</span>
<span class="font-data-sm text-data-sm text-status-warning">58.1 / 64.0 GB</span>
</div>
<div class="h-1 bg-border-subtle w-full rounded-full overflow-hidden">
<div class="h-full bg-status-warning meter-fill" style="width: 90%;"></div>
</div>
</div>
<!-- Battery -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<span class="font-data-sm text-data-sm text-on-surface">BAT</span>
<span class="font-data-sm text-data-sm text-status-healthy">82% Charging</span>
</div>
<div class="h-1 bg-border-subtle w-full rounded-full overflow-hidden flex">
<div class="h-full bg-status-healthy meter-fill" style="width: 78%;"></div>
</div>
</div>
</div>
</section>
<!-- Core Services -->
<section class="flex flex-col gap-stack-gap">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Core Services</h2>
<div class="flex justify-between bg-graphite-surface border border-border-subtle rounded p-3"><div class="flex flex-col items-center gap-1"><div class="w-3 h-3 rounded-full bg-status-healthy"></div><span class="font-label-caps text-label-caps text-on-surface">NexusNode</span></div><div class="flex flex-col items-center gap-1"><div class="w-3 h-3 rounded-full bg-status-healthy"></div><span class="font-label-caps text-label-caps text-on-surface">LocalToNet</span></div><div class="flex flex-col items-center gap-1"><div class="w-3 h-3 rounded-full bg-status-healthy"></div><span class="font-label-caps text-label-caps text-on-surface">OpenSSH</span></div><div class="flex flex-col items-center gap-1"><div class="w-3 h-3 rounded-full bg-status-healthy"></div><span class="font-label-caps text-label-caps text-on-surface">Ollama</span></div></div>
</section>
<!-- Active Task -->
<section class="flex flex-col gap-stack-gap">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Active Process</h2>
<div class="bg-graphite-raised border border-primary-fixed-dim rounded p-3 flex items-center justify-between">
<div class="flex flex-col">
<span class="font-data-md text-data-md text-primary-fixed-dim">RAG Index Rebuild</span>
<span class="font-data-sm text-data-sm text-on-surface-variant">PID: 4892 • CPU: 12%</span>
</div>
<span class="material-symbols-outlined text-primary-fixed-dim blink">autorenew</span>
</div>
</section>
<!-- Quick Directives -->
<section class="flex flex-col gap-stack-gap">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Quick Directives</h2>
<div class="grid grid-cols-2 gap-2"><button class="bg-graphite-surface border border-border-subtle rounded p-3 flex flex-col items-center gap-2 active:bg-surface-container-high active:border-primary-fixed-dim transition-colors"><span class="material-symbols-outlined text-on-surface">terminal</span><span class="font-label-caps text-label-caps text-on-surface">Console</span></button><button class="bg-graphite-surface border border-border-subtle rounded p-3 flex flex-col items-center gap-2 active:bg-surface-container-high active:border-primary-fixed-dim transition-colors"><span class="material-symbols-outlined text-on-surface">restart_alt</span><span class="font-label-caps text-label-caps text-on-surface">Restart</span></button><button class="bg-graphite-surface border border-border-subtle rounded p-3 flex flex-col items-center gap-2 active:bg-surface-container-high active:border-primary-fixed-dim transition-colors"><span class="material-symbols-outlined text-on-surface">settings</span><span class="font-label-caps text-label-caps text-on-surface">Settings</span></button><button class="bg-graphite-surface border border-border-subtle rounded p-3 flex flex-col items-center gap-2 active:bg-surface-container-high active:border-primary-fixed-dim transition-colors"><span class="material-symbols-outlined text-on-surface">admin_panel_settings</span><span class="font-label-caps text-label-caps text-on-surface">Admin</span></button><button class="bg-graphite-surface border border-border-subtle rounded p-3 flex flex-col items-center gap-2 active:bg-surface-container-high active:border-primary-fixed-dim transition-colors"><span class="material-symbols-outlined text-on-surface">backup</span><span class="font-label-caps text-label-caps text-on-surface">Backup</span></button><button class="bg-graphite-surface border border-border-subtle rounded p-3 flex flex-col items-center gap-2 active:bg-surface-container-high active:border-primary-fixed-dim transition-colors"><span class="material-symbols-outlined text-on-surface">analytics</span><span class="font-label-caps text-label-caps text-on-surface">Diagnostics</span></button></div>
</section>
</main>
<!-- Bottom Navigation Component -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-touch-target px-margin-mobile bg-surface-container-lowest border-t border-border-subtle pb-safe">
<!-- Dash (Active) -->
<button class="flex flex-col items-center justify-center text-primary-fixed-dim touch-none select-none active:scale-95 transition-transform active:bg-surface-container-high p-1 rounded w-12">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="font-label-caps text-label-caps">Dash</span>
</button>
<!-- Vault -->
<button class="flex flex-col items-center justify-center text-on-surface-variant touch-none select-none active:scale-95 transition-transform active:bg-surface-container-high p-1 rounded w-12">
<span class="material-symbols-outlined">storage</span>
<span class="font-label-caps text-label-caps">Vault</span>
</button>
<!-- Media -->
<button class="flex flex-col items-center justify-center text-on-surface-variant touch-none select-none active:scale-95 transition-transform active:bg-surface-container-high p-1 rounded w-12">
<span class="material-symbols-outlined">movie</span>
<span class="font-label-caps text-label-caps">Media</span>
</button>
<!-- Tasks -->
<button class="flex flex-col items-center justify-center text-on-surface-variant touch-none select-none active:scale-95 transition-transform active:bg-surface-container-high p-1 rounded w-12">
<span class="material-symbols-outlined">task_alt</span>
<span class="font-label-caps text-label-caps">Tasks</span>
</button>
<!-- AI -->
<button class="flex flex-col items-center justify-center text-on-surface-variant touch-none select-none active:scale-95 transition-transform active:bg-surface-container-high p-1 rounded w-12">
<span class="material-symbols-outlined">psychology</span>
<span class="font-label-caps text-label-caps">AI</span>
</button>
<!-- More -->
<button class="flex flex-col items-center justify-center text-on-surface-variant touch-none select-none active:scale-95 transition-transform active:bg-surface-container-high p-1 rounded w-12">
<span class="material-symbols-outlined">menu</span>
<span class="font-label-caps text-label-caps">More</span>
</button>
</nav>


</body></html>
